<svg xmlns="http://www.w3.org/2000/svg" width="800" height="340" viewBox="0 0 800 340" role="img" aria-labelledby="title desc"><title id="title">Partial reconstruction of the LACP lab</title><desc id="desc">SW1 and SW2 each use Ethernet0/0 and Ethernet0/1 in the LACP bundle. Physical pairings and the Monitoring VLAN number are unspecified.</desc><rect width="800" height="340" fill="#fff"/><text x="400" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#111">Schematic from task; actual port pairings not supplied</text><rect x="70" y="115" width="170" height="100" rx="12" fill="#eaf2ff" stroke="#1a3f7b" stroke-width="3"/><rect x="560" y="115" width="170" height="100" rx="12" fill="#eaf2ff" stroke="#1a3f7b" stroke-width="3"/><text x="155" y="175" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#111">SW1</text><text x="645" y="175" text-anchor="middle" font-family="sans-serif" font-size="26" fill="#111">SW2</text><path d="M240 140 H560 M240 190 H560" stroke="#18385f" stroke-width="4"/><g font-family="sans-serif" font-size="17" fill="#111"><text x="246" y="130">E0/0</text><text x="515" y="130">E0/0</text><text x="246" y="216">E0/1</text><text x="515" y="216">E0/1</text><text x="400" y="165" text-anchor="middle">LACP: Port-channel 44</text><text x="400" y="285" text-anchor="middle">MONITORING VLAN ID and physical pairings must be verified</text></g></svg>