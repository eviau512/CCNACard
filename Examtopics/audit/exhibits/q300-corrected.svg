<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="770" viewBox="0 0 1280 770"><rect width="1280" height="770" fill="white"/><text x="32" y="40" font-family="Arial" font-size="25">Revised exercise - distinct interface IPs; mismatched OSPF timers</text><rect x="20" y="66" width="1240" height="310" rx="6" fill="#f0f4f8"/><text x="38" y="102" font-family="monospace" font-size="22" xml:space="preserve">R1# show ip ospf interface Ethernet0</text><text x="38" y="136" font-family="monospace" font-size="22" xml:space="preserve">Ethernet0 is up, line protocol is up</text><text x="38" y="170" font-family="monospace" font-size="22" xml:space="preserve">  Internet Address 192.168.1.2/24, Area 0</text><text x="38" y="204" font-family="monospace" font-size="22" xml:space="preserve">  Process ID 1, Router ID 192.168.31.33, Network Type BROADCAST, Cost: 10</text><text x="38" y="238" font-family="monospace" font-size="22" xml:space="preserve">  Transmit Delay is 1 sec, State DR, Priority 1</text><text x="38" y="272" font-family="monospace" font-size="22" xml:space="preserve">  Designated Router (ID) 192.168.31.33, Interface address 192.168.1.2</text><text x="38" y="306" font-family="monospace" font-size="22" xml:space="preserve">  No backup designated router on this network</text><text x="38" y="340" font-family="monospace" font-size="22" xml:space="preserve">  Timer intervals configured, Hello 5, Dead 20, Wait 20, Retransmit 5</text><rect x="20" y="416" width="1240" height="310" rx="6" fill="#f0f4f8"/><text x="38" y="452" font-family="monospace" font-size="22" xml:space="preserve">R2# show ip ospf interface Ethernet0</text><text x="38" y="486" font-family="monospace" font-size="22" xml:space="preserve">Ethernet0 is up, line protocol is up</text><text x="38" y="520" font-family="monospace" font-size="22" xml:space="preserve">  Internet Address 192.168.1.1/24, Area 0</text><text x="38" y="554" font-family="monospace" font-size="22" xml:space="preserve">  Process ID 2, Router ID 192.168.31.11, Network Type BROADCAST, Cost: 10</text><text x="38" y="588" font-family="monospace" font-size="22" xml:space="preserve">  Transmit Delay is 1 sec, State DR, Priority 1</text><text x="38" y="622" font-family="monospace" font-size="22" xml:space="preserve">  Designated Router (ID) 192.168.31.11, Interface address 192.168.1.1</text><text x="38" y="656" font-family="monospace" font-size="22" xml:space="preserve">  No backup designated router on this network</text><text x="38" y="690" font-family="monospace" font-size="22" xml:space="preserve">  Timer intervals configured, Hello 10, Dead 40, Wait 40, Retransmit 5</text></svg>