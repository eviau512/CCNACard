<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="title desc"><title id="title">Partial reconstruction of the three-switch lab</title><desc id="desc">SW1 E0/2 connects to SW2 E0/2; SW2 E0/3 connects to SW3 E0/3. PC placement, access ports and per-link VLAN requirements are not specified.</desc><rect width="900" height="310" fill="#fff"/><text x="450" y="35" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#111">Partial reconstruction from the task</text><g fill="#eaf2ff" stroke="#1a3f7b" stroke-width="3"><rect x="40" y="115" width="160" height="90" rx="12"/><rect x="370" y="115" width="160" height="90" rx="12"/><rect x="700" y="115" width="160" height="90" rx="12"/></g><g fill="#111" font-family="sans-serif" font-size="25" text-anchor="middle"><text x="120" y="170">SW1</text><text x="450" y="170">SW2</text><text x="780" y="170">SW3</text></g><path d="M200 160 H370 M530 160 H700" stroke="#18385f" stroke-width="4"/><g fill="#111" font-family="sans-serif" font-size="17"><text x="205" y="148">E0/2</text><text x="326" y="148">E0/2</text><text x="535" y="148">E0/3</text><text x="656" y="148">E0/3</text><text x="450" y="250" text-anchor="middle">PC ports and per-link VLAN membership were not supplied</text><text x="450" y="279" text-anchor="middle">VLAN 202 MARKETING; VLAN 303 FINANCE</text></g></svg>